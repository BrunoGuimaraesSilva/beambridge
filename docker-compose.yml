version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_URL=postgres://beambridge:beambridge@postgres:5432/beambridge?sslmode=disable
      - REDIS_ADDR=redis:6379
    volumes:
      - .:/app # Mount local project to /app in container
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beambridge-net
    restart: on-failure

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=beambridge
      - POSTGRES_PASSWORD=beambridge
      - POSTGRES_DB=beambridge
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beambridge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - beambridge-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - beambridge-net

networks:
  beambridge-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data: